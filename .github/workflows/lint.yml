# 检查 Markdown 规范、中文排版、include 行号范围，并在构建后检查站内锚点
#
name: Lint docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown, custom rule self-tests and include ranges
        run: pnpm lint

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Check anchored links against the build output
        run: pnpm check:anchors
